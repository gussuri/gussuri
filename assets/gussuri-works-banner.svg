<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gussuri Works</title>
  <desc id="desc">Gussuri Works — ぐっすり眠れれば、作れないものはない。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d071a"/>
      <stop offset="52%" stop-color="#24103f"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#e9d5ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="950" cy="85" r="86" fill="#c084fc" opacity=".18" filter="url(#blur)"/>
  <circle cx="1030" cy="228" r="68" fill="#7c3aed" opacity=".3" filter="url(#blur)"/>
  <g fill="#f5e9ff">
    <circle cx="837" cy="70" r="2.5" opacity=".8"/>
    <circle cx="882" cy="211" r="2" opacity=".7"/>
    <circle cx="1086" cy="74" r="2.5" opacity=".85"/>
    <circle cx="1132" cy="178" r="1.8" opacity=".65"/>
    <circle cx="780" cy="250" r="1.6" opacity=".6"/>
  </g>
  <g transform="translate(970 150)">
    <circle r="72" fill="#f5e9ff" opacity=".96"/>
    <circle cx="28" cy="-24" r="72" fill="#2a1248"/>
  </g>
  <text x="92" y="125" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">Gussuri Works</text>
  <text x="96" y="178" fill="#f3e8ff" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="23">ぐっすり眠れれば、作れないものはない。</text>
  <text x="96" y="224" fill="#d8b4fe" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing=".2">Small tools for a quieter, smarter web.</text>
  <rect x="96" y="255" width="92" height="4" rx="2" fill="#c084fc"/>
  <rect x="196" y="255" width="32" height="4" rx="2" fill="#8b5cf6" opacity=".7"/>
</svg>
